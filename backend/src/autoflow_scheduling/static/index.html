<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoFlow 工单中心</title>
<style>body{font:16px system-ui;max-width:980px;margin:1.5rem auto;padding:0 1rem;background:#f4f6f8;color:#18212b}section{background:#fff;padding:1rem 1.25rem;margin:1rem 0;border-radius:10px;box-shadow:0 1px 5px #d9dee3}input,button{padding:.55rem;margin:.2rem;border:1px solid #ccd3da;border-radius:5px}button{cursor:pointer;background:#1457d9;color:#fff;border:0}.secondary{background:#66717d}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.message{margin-left:.5rem}.success{color:#087f3d}.error{color:#b42318}pre{white-space:pre-wrap;background:#f5f7fa;padding:.8rem;border-radius:5px}</style></head>
<body><h1>AutoFlow 工单中心</h1>
<section><h2>登录</h2><div class="grid"><input id="username" value="agent" placeholder="用户名"><input id="password" type="password" value="agent-pass" placeholder="密码"></div><button onclick="login()">登录</button><span id="loginMessage" class="message"></span></section>
<section id="customer" class="hidden"><h2>客户预约</h2><div class="grid"><input id="vehicleId" value="vehicle-magotan-2021"><input id="serviceCode" value="engine-diagnosis-web"><input id="earliest" value="2026-01-01T09:00:00Z"><input id="latest" value="2026-01-01T17:00:00Z"></div><p>示例服务：发动机故障诊断，需要诊断工位和 OBD 设备。</p><button onclick="solve()">查询调度方案</button><pre id="planResult"></pre><button id="confirmButton" class="hidden" onclick="confirmPlan()">确认方案并创建工单</button><pre id="workOrderResult"></pre></section>
<section id="lookup" class="hidden"><h2>工单查询</h2><input id="orderNo" placeholder="WO-..."><button onclick="lookup()">查询</button><button class="secondary" onclick="cancelOrder()">取消确认中的工单</button><pre id="orderResult"></pre></section>
<section id="store" class="hidden"><h2>门店执行</h2><button onclick="transition('check-in')">确认到店</button><button onclick="transition('complete')">完成服务</button><span id="storeMessage" class="message"></span></section>
<script>let token='',role='',plan=null;const $=id=>document.getElementById(id);const auth=()=>({Authorization:'Bearer '+token});
async function api(path,options={}){options.headers={...(options.headers||{}),...auth(),'Content-Type':'application/json'};const r=await fetch(path,options);const d=await r.json();if(!r.ok)throw new Error(d.detail||'请求失败');return d}
async function login(){try{const r=await fetch('/api/auth/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.detail);token=d.access_token;role=d.role;$('loginMessage').textContent='登录成功：'+role;$('loginMessage').className='message success';$('customer').classList.remove('hidden');$('lookup').classList.remove('hidden');if(role==='SERVICE_ADVISOR')$('store').classList.remove('hidden')}catch(e){$('loginMessage').textContent=e.message;$('loginMessage').className='message error'}}
async function solve(){try{const req={task_id:$('serviceCode').value,vehicle_id:$('vehicleId').value,brand:'volkswagen',store_id:'vw-store-1',duration_minutes:60,earliest_start:$('earliest').value,latest_end:$('latest').value,required_skills:['engine-diagnosis'],required_workstation_types:['diagnostic'],required_equipment_types:['obd-scanner']};const d=await api('/api/schedules/solve',{method:'POST',body:JSON.stringify(req)});plan={plan:d.plan,requirement:req};$('planResult').textContent=JSON.stringify(d.plan,null,2);$('confirmButton').classList.remove('hidden')}catch(e){$('planResult').textContent=e.message}}
async function confirmPlan(){try{const c=await api('/api/confirmed-plans',{method:'POST',body:JSON.stringify({plan:plan.plan,requirement:plan.requirement,confirmation_token:'browser-confirmed'})});const d=await api('/api/work-orders',{method:'POST',body:JSON.stringify({confirmed_plan_id:c.confirmed_plan_id,confirmation_token:'browser-confirmed',idempotency_key:'browser-'+Date.now()})});$('workOrderResult').textContent='预约成功：\n'+JSON.stringify(d,null,2);$('orderNo').value=d.order_no}catch(e){$('workOrderResult').textContent=e.message}}
async function lookup(){try{$('orderResult').textContent=JSON.stringify(await api('/api/work-orders/'+encodeURIComponent($('orderNo').value)),null,2)}catch(e){$('orderResult').textContent=e.message}}
async function cancelOrder(){try{$('orderResult').textContent=JSON.stringify(await api('/api/work-orders/'+encodeURIComponent($('orderNo').value)+'/cancel',{method:'POST',body:JSON.stringify({confirmation_token:'browser-confirmed',expected_confirmation_token:'browser-confirmed'})}),null,2)}catch(e){$('orderResult').textContent=e.message}}
async function transition(action){try{$('storeMessage').textContent=JSON.stringify(await api('/api/store/work-orders/'+encodeURIComponent($('orderNo').value)+'/'+action,{method:'POST'}))}catch(e){$('storeMessage').textContent=e.message}}
</script></body></html>
