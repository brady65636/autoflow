services:
  autoflow:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      AUTOFLOW_JWT_SECRET: ${AUTOFLOW_JWT_SECRET:-change-me-in-production}
      AUTOFLOW_DATABASE_URL: sqlite:///./data/autoflow.db
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-autoflow-rag}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      AUTOFLOW_ENVIRONMENT: ${AUTOFLOW_ENVIRONMENT:-dev}
      AUTOFLOW_RELEASE_VERSION: ${AUTOFLOW_RELEASE_VERSION:-0.2.0}
      AUTOFLOW_PIPELINE_VERSION: ${AUTOFLOW_PIPELINE_VERSION:-4}
      AUTOFLOW_CORPUS_VERSION: ${AUTOFLOW_CORPUS_VERSION:-}
      AUTOFLOW_INDEX_VERSION: ${AUTOFLOW_INDEX_VERSION:-}
      AUTOFLOW_EMBEDDING_MODEL: ${AUTOFLOW_EMBEDDING_MODEL:-}
      AUTOFLOW_RERANKER_MODE: ${AUTOFLOW_RERANKER_MODE:-none}
      AUTOFLOW_RERANKER_MODEL: ${AUTOFLOW_RERANKER_MODEL:-}
      AUTOFLOW_PROMPT_VERSION: ${AUTOFLOW_PROMPT_VERSION:-}
    volumes:
      - autoflow-data:/app/data

volumes:
  autoflow-data:
